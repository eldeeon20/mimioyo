name: build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache Dart pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-v1
          restore-keys: |
            gradle-${{ runner.os }}-

      - run: flutter pub get

      - name: Analyze Dart (fail fast)
        run: flutter analyze --no-fatal-infos

      - name: Build android
        run: flutter build apk --release --target-platform android-arm64

      - name: Diagnostico de Gradle
        if: failure()
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace --console=plain 2>&1 | tail -300

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: mimioyo-android
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
